# ==================== 方法变体（论文组合靠配置） ====================
method:
  representation: rp          # rp | mrp（mrp = 阶段 M）
  attention: se               # none | se | additive（additive = 阶段 M）
  rhythm_filter: false        # 论文1 脑节律；振动任务保持 false
  quality_assess: false       # 论文1 图像质量评估
  # RP / 相空间
  embedding_dim: 3            # m
  time_delay: 1               # tau
  # 递归阈值：相对距离分位数（0~1）；也可用绝对 epsilon（非 null 时优先）
  recurrence_percentile: 0.1
  epsilon: null
  rp_image_size: 64           # 缩放到固定边长再喂 CNN

# ==================== 数据 ====================
data:
  source: rotating
  raw_data_dir: "D:/project/Python/rotating_machinery_diagnosis/datas/raw_datas"
  cache_dir: "./datas/rp_images"
  class_map:
    normal: 0
    inner: 1
    outer: 2
    combine: 3
    roll: 4
  window_size: 256
  num_windows_per_class: 10000  # 正式：每类 1e4
  test_ratio: 0.2
  random_state: 42

# ==================== 训练 ====================
train:
  batch_size: 32
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  early_stop_patience: 8
  num_workers: 0
  device: "cuda"
  checkpoint_dir: "./datas/checkpoints"
  save_best_model: "best_rp_cnn.pt"
  seed: 42

# ==================== 输出 ====================
output:
  run_tsne: false
  plot_curve: true
