# Independent within-subject 3-way experiment: RP + SE CNN only.
method:
  representation: rp
  attention: se
  rhythm_filter: false
  rhythm_band: delta
  quality_assess: false
  embed_select: fixed
  embedding_dim: 3
  time_delay: 12
  epsilon_mode: percentile      # 0.05/0.10/0.20 below are recurrence percentiles
  recurrence_percentile: 0.10
  epsilon_std_k: 0.25
  diameter_frac: 0.10
  epsilon: null
  normalize: zscore
  sampling_rate: 1000
  rp_image_size: 64

model:
  conv_channels: [32, 64, 128]
  fc_hidden: []
  kernel_size: 3
  pool_size: 2

data:
  source: ds002680
  bids_root: "./datas/ds002680"
  output_root: "./datas/experiments_3way"
  splits_dir: "./datas/experiments_3way/splits"
  quality_dir: "./datas/experiments_3way/quality"
  subjects: [sub-002, sub-003, sub-004]
  correct_only: true
  epoch_samples: 512
  rp_device: cuda
  rp_batch_size: 8
  max_samples: null
  max_runs: null
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true
  split_seed: 42

train:
  output_dir: "./datas/experiments_3way/checkpoints"
  checkpoint_name: "best_rp_se.pt"
  evaluate_test: false
  batch_size: 16
  epochs: 200
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  stop_on: val_acc
  early_stop_patience: 30
  num_workers: 0
  device: "cuda"
  deterministic: true
  require_gpu: true
  seed: 42
  seeds: [42, 43, 44]

tuning:
  representation:
    time_windows: [400, 512, 800]
    recurrence_percentiles: [0.05, 0.10, 0.20]
  model:
    conv_channels:
      - [24, 48, 96]
      - [32, 64, 128]
    dropout: [0.2, 0.3, 0.4]
    lr: [0.0005, 0.001]
    batch_size: [16, 32]


