# 三集协议对齐老师方案：状态转移矩阵 + CNN。
# 数据协议与冻结 RP 相同：correct-only、800 ms、70/15/15、split_seed=42。
# 复用 datas/experiments_3way/splits/，不覆盖 RP 冻结划分。
# 表示用老师第一版：6 节点、1/2/3 步、各导平均、概率权重。
# 6x6 矩阵只用两层卷积。test 默认封闭。
method:
  representation: transition
  attention: se
  rhythm_filter: false
  rhythm_band: delta
  quality_assess: false
  normalize: zscore
  sampling_rate: 1000
  symbol_bins: 6
  symbol_strategy: uniform
  bin_scope: per_epoch
  transition_steps: [1, 2, 3]
  transition_weight: probability
  transition_multichannel: mean
  include_self_transition: true

model:
  conv_channels: [32, 64]
  fc_hidden: []
  kernel_size: 3
  pool_size: 2

data:
  source: ds002680
  bids_root: "./datas/ds002680"
  output_root: "./datas/experiments_3way/transition/representations/ep800_b6_s123"
  splits_dir: "./datas/experiments_3way/splits"
  quality_dir: "./datas/experiments_3way/quality"
  subjects: [sub-002, sub-003, sub-004, sub-005, sub-006, sub-007, sub-008, sub-009, sub-010, sub-011, sub-012, sub-013, sub-014, sub-015]
  correct_only: true
  epoch_samples: 800
  rp_device: cpu
  rp_batch_size: 32
  max_samples: null
  max_runs: null
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true
  split_seed: 42

train:
  output_dir: "./datas/experiments_3way/transition/checkpoints"
  checkpoint_name: "best_transition_se.pt"
  evaluate_test: false
  batch_size: 32
  epochs: 200
  optimizer: adam
  lr: 0.0005
  weight_decay: 0.0001
  dropout: 0.2
  stop_on: val_acc
  early_stop_patience: 30
  num_workers: 0
  device: "cuda"
  deterministic: true
  require_gpu: false
  seed: 42
  seeds: [42, 43, 44]
