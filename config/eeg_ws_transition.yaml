# 个体内正式 Transition：多时间步状态转移矩阵 + CNN
method:
  representation: transition
  attention: se
  rhythm_filter: false
  rhythm_band: delta
  quality_assess: false
  normalize: zscore
  sampling_rate: 1000
  symbol_bins: 10
  symbol_strategy: uniform
  bin_scope: per_epoch
  transition_steps: [1, 2, 3]
  transition_weight: probability
  transition_multichannel: stack
  include_self_transition: true

model:
  conv_channels: [32, 64]
  fc_hidden: []
  kernel_size: 3
  pool_size: 2

data:
  source: ds002680
  protocol: within_subject
  subject: sub-002
  bids_root: "./datas/ds002680"
  epoch_samples: 512
  max_samples: 1500
  max_runs: null
  train_ratio: 0.7
  eval_samples: null
  stratify: true
  force_rebuild: false
  class_map:
    cat_go: 0
    cat_nogo: 1
    rec_go: 2
    rec_nogo: 3

train:
  batch_size: 16
  epochs: 200
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  momentum: 0.9
  dropout: 0.3
  augment: false
  gaussian_std: 0.05
  channel_dropout: 0.2
  stop_on: val_loss
  early_stop_patience: 30
  num_workers: 0
  device: "cuda"
  seed: 42

output:
  run_tsne: true
  tsne_perplexity: 30
  tsne_iter: 1000
  plot_curve: true
  plot_confusion: true
