# 方案 B：时间切分 + 不重叠窗；阶段 R（rp + se）试跑
method:
  representation: rp
  attention: se
  rhythm_filter: false
  quality_assess: false
  embedding_dim: 3
  time_delay: 1
  recurrence_percentile: 0.1
  epsilon: null
  rp_image_size: 64

data:
  source: rotating
  raw_data_dir: "D:/project/Python/rotating_machinery_diagnosis/datas/raw_datas"
  cache_dir: "./datas/rp_images_B"
  class_map:
    normal: 0
    inner: 1
    outer: 2
    combine: 3
    roll: 4
  window_size: 256
  stride: 256                 # >= window_size，禁止重叠
  train_ratio: 0.7
  val_ratio: 0.15             # test = 剩余 0.15
  # max_windows_per_class: null  # 不设则用满各段可切窗数

train:
  batch_size: 32
  epochs: 30
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  early_stop_patience: 8
  num_workers: 0
  device: "cuda"
  checkpoint_dir: "./datas/checkpoints_B_r"
  save_best_model: "best_rp_cnn_B.pt"
  seed: 42

output:
  run_tsne: false
  plot_curve: true
