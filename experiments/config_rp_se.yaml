# Independent experiment module: RP + SE CNN, no additional model modules.
method:
  representation: rp
  attention: se
  rhythm_filter: false
  rhythm_band: delta
  quality_assess: false
  embed_select: fixed
  embedding_dim: 3
  time_delay: 12
  epsilon_mode: percentile
  recurrence_percentile: 0.10
  epsilon_std_k: 0.25
  diameter_frac: 0.10
  epsilon: null
  normalize: zscore
  sampling_rate: 1000
  rp_image_size: 64

model:
  conv_channels: [32, 64, 128]
  fc_hidden: []
  kernel_size: 3
  pool_size: 2

data:
  source: ds002680
  bids_root: "./datas/ds002680"
  output_root: "./datas/experiments_rp_se"
  subjects: [sub-002, sub-003, sub-004, sub-005, sub-006, sub-007, sub-008, sub-009, sub-010, sub-011, sub-012, sub-013, sub-014, sub-015]
  correct_only: true
  epoch_samples: 512
  max_samples: null
  max_runs: null
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  stratify: true
  split_seed: 42

train:
  output_dir: "./datas/experiments_rp_se/checkpoints"
  checkpoint_name: "best_rp_se.pt"
  batch_size: 16
  epochs: 200
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0001
  dropout: 0.3
  stop_on: val_acc
  early_stop_patience: 30
  num_workers: 0
  device: "cuda"
  seed: 42

